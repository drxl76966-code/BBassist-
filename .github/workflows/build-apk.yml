name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Locate project
        id: p
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            unzip -q BlockBlastAssist.zip -d _src
            echo "dir=_src/BlockBlastAssist" >> "$GITHUB_OUTPUT"
          fi
      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlastAssist-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
